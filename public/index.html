<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gospel, devotional, and course resources for Thai church and mission." />
    <meta name="theme-color" content="#173f35" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Truth for Life and Mission" />
    <meta property="og:description" content="Gospel, devotional, and course resources for Thai church and mission." />
    <meta property="og:url" content="https://tflm.pages.dev/" />
    <meta property="og:image" content="https://tflm.pages.dev/social-preview-20260730-poster.png" />
    <meta property="og:image:secure_url" content="https://tflm.pages.dev/social-preview-20260730-poster.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Truth for Life and Mission" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Truth for Life and Mission" />
    <meta name="twitter:description" content="Gospel, devotional, and course resources for Thai church and mission." />
    <meta name="twitter:image" content="https://tflm.pages.dev/social-preview-20260730-poster.png" />
    <link rel="icon" type="image/png" href="/site-logo.png" />
    <link rel="canonical" href="https://tflm.pages.dev/" />
    <title>Truth for Life and Mission</title>
    <script>
      const language = (navigator.language || "").toLowerCase();
      const path = language.startsWith("th") ? "/th/" : language.startsWith("ko") ? "/ko/" : "/en/";
      window.location.replace(path);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f5ec;
        color: #173f35;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(90vw, 560px);
        padding: 32px;
        border-radius: 24px;
        background: #fffef9;
        box-shadow: 0 20px 60px rgba(23, 63, 53, 0.12);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 22px;
        color: #657570;
        line-height: 1.65;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      a {
        border: 1px solid #dbe6e1;
        border-radius: 999px;
        padding: 10px 16px;
        color: #173f35;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/site-logo.png" alt="" width="96" height="96" />
      <h1>Truth for Life and Mission</h1>
      <p>Gospel, devotional, and course resources for Thai church and mission.</p>
      <nav aria-label="Choose language">
        <a href="/th/">ไทย</a>
        <a href="/ko/">한국어</a>
        <a href="/en/">English</a>
      </nav>
    </main>
  </body>
</html>
